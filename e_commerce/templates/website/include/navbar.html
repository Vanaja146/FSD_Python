{% load static %}
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

<nav class="navbar navbar-dark bg-dark">
    <div class="container d-flex justify-content-between align-items-center">
        <!-- Brand -->
        <a class="navbar-brand" href="{% url 'home' %}">My Shop</a>

        <!-- Navbar links -->
        <div class="d-flex align-items-center">
            <a class="nav-link text-white mx-2 d-flex align-items-center" href="{% url 'home' %}">
                <i class="bi bi-house-door-fill me-1"></i> Home
            </a>
            <a class="nav-link text-white mx-2 d-flex align-items-center" href="{% url 'product_list' %}">
                <i class="bi bi-box-seam me-1"></i> Products
            </a>
            <a class="nav-link text-white mx-2 d-flex align-items-center" href="{% url 'cart' %}">
                <i class="bi bi-cart-fill me-1"></i> Cart
            </a>

            {% if user.is_authenticated %}
                <a class="nav-link text-white mx-2 d-flex align-items-center" href="{% url 'profile' %}">
                    <i class="bi bi-person-circle me-1"></i> {{ user.username }}
                </a>
                <a class="nav-link text-white mx-2 d-flex align-items-center" href="{% url 'logout' %}">
                    <i class="bi bi-box-arrow-right me-1"></i> Logout
                </a>
            {% else %}
                <a class="nav-link text-white mx-2 d-flex align-items-center" href="{% url 'login' %}">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Login
                </a>
                <a class="nav-link text-white mx-2 d-flex align-items-center" href="{% url 'signup' %}">
                    <i class="bi bi-person-plus-fill me-1"></i> Signup
                </a>
            {% endif %}
        </div>
    </div>
</nav>
